name: Update README cards

on:
  schedule:
    - cron: "0 3 * * *"
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - name: Generate stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&hide_border=true&bg_color=002B36&title_color=268BD2&text_color=839496&icon_color=2AA198
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate top languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&hide_border=true&bg_color=002B36&title_color=268BD2&text_color=839496
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate streak stats
        uses: DenverCoder1/github-readme-streak-stats@main
        with:
          options: user=${{ github.repository_owner }}&background=002B36&border=073642&stroke=073642&ring=268BD2&fire=CB4B16&currStreakNum=EEE8D5&sideNums=839496&currStreakLabel=93A1A1&sideLabels=839496&dates=586E75&disable_animations=true
          path: profile/streak.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      # Every branch this workflow touches may be protected (master is), so
      # changes are never pushed directly — they go through a PR like any
      # other change, bot-authored or not. Merged immediately below since
      # there's nothing to wait on (no required reviews on generated files).
      - name: Open PR with refreshed cards
        id: cards-pr
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "Update README cards"
          branch: bot/readme-cards-update
          delete-branch: true
          title: "Update README cards"
          body: Automated refresh of the GitHub stats/top-langs/streak SVGs in `profile/`, generated by this workflow.
          add-paths: profile/*.svg

      - name: Merge cards PR
        if: steps.cards-pr.outputs.pull-request-number
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr merge --squash --delete-branch "${{ steps.cards-pr.outputs.pull-request-number }}"
